name: Build Template

on:
  push:
    branches:
      - default
    tags-ignore:
      - '**'
  pull_request:
    branches-ignore:
      - 'dependabot/**'

permissions:
  contents: read

jobs:
  windows-lazbuild:
    name: 'Build demo plugin with Lazarus'
    env:
      LAZARUS_VERSION: '4.8'
      CROSS_BUILD: true
      ARTIFACT_NAME: HelloWorld

    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Restore Lazarus installer
        id: lazarus-exe-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: 'C:\lazarus-src'
          key: lazarus-${{ env.LAZARUS_VERSION }}-${{ runner.os }}

      - name: Install Lazarus ${{ env.LAZARUS_VERSION }}
        run: |
          irm -Uri https://bitbucket.org/rdipardo/lazarus-orb/raw/main/src/scripts/install_windows_lazarus.ps1 | iex

      - name: Cache Lazarus installer
        if: steps.lazarus-exe-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: 'C:\lazarus-src'
          key: ${{ steps.lazarus-exe-cache.outputs.cache-primary-key }}

      - name: Build plugin
        run: |
          lazbuild --bm=Release --cpu=x86_64 .\Lazarus\helloworld.lpi
          lazbuild --bm=Release --cpu=i386 .\Lazarus\helloworld.lpi

      - name: Upload ${{ env.ARTIFACT_NAME }} (x64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}Plugin-x64
          path: Lazarus/out/x86_64-win64/Release/${{ env.ARTIFACT_NAME }}.dll

      - name: Upload ${{ env.ARTIFACT_NAME }} (win32)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}Plugin-win32
          path: Lazarus/out/i386-win32/Release/${{ env.ARTIFACT_NAME }}.dll
